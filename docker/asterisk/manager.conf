;
; Asterisk Manager Interface (AMI) configuration.
;
; Baked into the image so AMI is always available on port 5038 regardless of
; whether the Laravel config generator has written anything to
; /etc/asterisk/generated. The Orbital app connects here from
; orbital.test:5038 using the ASTERISK_AMI_* env vars.
;
; The secret below is a placeholder that never works: the entrypoint
; refuses to start Asterisk unless ASTERISK_AMI_SECRET is set, and
; writes that value here at boot. Laravel (config/telephony.php) and the
; config-sync sidecar read the same ASTERISK_AMI_SECRET.
;
; Logins are accepted from loopback and RFC 1918 sources only: the app
; and sidecars reach AMI over the container network, never the internet.
;
; Write classes are limited to what Orbital sends: Login/Logoff,
; Command (`core reload`, `dialplan reload`, `core show channels`,
; `pjsip show contacts`, `voicemail reload`, `module reload ...`) and
; Originate (dialplan targets and MusicOnHold). `system` is left out so
; Originate cannot run System()/Exec()/SHELL(); `config` and `dialplan`
; are left out because nothing uses UpdateConfig or DialplanExtensionAdd.
;
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = no
webenabled = no
brokeneventsaction = yes
allowmultiplelogin = yes

[orbital]
secret = UNSET-set-ASTERISK_AMI_SECRET
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.0/255.0.0.0
permit = 10.0.0.0/255.0.0.0
permit = 172.16.0.0/255.240.0.0
permit = 192.168.0.0/255.255.0.0
read = system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan
write = call,log,verbose,command,agent,user,dtmf,reporting,cdr,originate
