{{- if .Values.agentWorker.enabled -}}
{{/*
The shared bearer token the agent worker uses against the Laravel API.
A Secret, not the app-env ConfigMap: whoever holds it can read the AI
provider keys and every tenant's prompts, and ConfigMaps are readable by
far more of the cluster. The value is required (see
orbital.agentWorkerToken); the chart refuses to render without one.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orbital.componentName" (list . "agent-worker-token") }}
  labels:
    {{- include "orbital.componentLabels" (list . "agent-worker-token") | nindent 4 }}
type: Opaque
data:
  AGENT_WORKER_TOKEN: {{ include "orbital.agentWorkerToken" . | b64enc | quote }}
{{- end }}
